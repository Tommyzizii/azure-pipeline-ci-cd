<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ app_name }}</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #f1f5f9;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 48px 56px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
        }
        h1 {
            margin: 0 0 8px;
            font-size: 2.2rem;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        p.tag {
            margin: 0 0 28px;
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .meta {
            display: grid;
            grid-template-columns: auto auto;
            gap: 6px 16px;
            text-align: left;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        .meta span.label {
            color: #64748b;
        }
        .badge {
            display: inline-block;
            margin-top: 24px;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.03em;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{ Tommy's DevOps Lab }}</h1>
        <p class="tag">Shipped via Docker; deployed CI/CD Github Actions 🚀</p>
        <div class="meta">
            <span class="label">Version</span><span>{{ app_version }}</span>
            <span class="label">Environment</span><span>{{ environment }}</span>
            <span class="label">Hostname</span><span>{{ hostname }}</span>
            <span class="label">Server time</span><span>{{ now }}</span>
        </div>
        <div class="badge">● running</div>
    </div>
</body>
</html>
