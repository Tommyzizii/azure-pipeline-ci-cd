name: Build And Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'app/backend/**'
      - 'app/frontend/**'
      - 'app/integration/**'
      - 'requirements.txt'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Manual image tag (defaults to short SHA)'
        required: false
        default: ''
  schedule:
    - cron: '0 2 * * 0'   # weekly Sunday 02:00 UTC rebuild

env:
  APP_NAME: myapp

jobs:
  # Detect which service(s) changed so don't need to rebuild everything on every push.
  # Any trigger other than a plain push (manual, release, schedule) rebuilds all services.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'app/backend/**'
              - 'requirements.txt'
            frontend:
              - 'app/frontend/**'
            integration:
              - 'app/integration/**'
              - 'requirements.txt'

  build-and-push:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: app/backend/Dockerfile
            context: .
          - service: frontend
            dockerfile: app/frontend/Dockerfile
            context: .
          - service: integration
            dockerfile: app/integration/Dockerfile
            context: .
    # Build this service if: it changed on a push, OR the trigger isn't a push
    # (manual dispatch, release, and schedule always rebuild every service).
    if: |
      github.event_name != 'push' ||
      needs.changes.outputs[matrix.service] == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.APP_NAME }}-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.APP_NAME }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=dockerhub-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=dockerhub-${{ matrix.service }}

      - name: Record build info artifact
        run: |
          mkdir -p build-info
          {
            echo "service=${{ matrix.service }}"
            echo "image=${{ env.APP_NAME }}-${{ matrix.service }}"
            echo "tag=${{ steps.tag.outputs.tag }}"
            echo "trigger=${{ github.event_name }}"
            echo "sha=${{ github.sha }}"
          } > build-info/${{ matrix.service }}.txt

      - name: Upload build info artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockerhub-build-info-${{ matrix.service }}
          path: build-info/${{ matrix.service }}.txt
          retention-days: 14