name: Push Docker Image To ACR Using Buildx

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'app/backend/**'
      - 'app/frontend/**'
      - 'app/integration/**'
      - 'requirements.txt'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      service:
        description: 'Which service to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - frontend
          - integration
      push_image:
        description: 'Push image to ACR? (false = build only, no push)'
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '0 2 * * 0'   # weekly Sunday 02:00 UTC rebuild (base-image patches)

env:
  ACR_REGISTRY: learndevopsnow.azurecr.io
  APP_NAME: buildx-app

jobs:
  # detect which service dirs changed so
  # plain branch pushes only rebuild what actually moved.
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'app/backend/**'
              - 'requirements.txt'
            frontend:
              - 'app/frontend/**'
            integration:
              - 'app/integration/**'
              - 'requirements.txt'

  # build-and-push only runs once this passes. 
  # Replace the placeholder with real test/lint commands when ready.
  test:
    runs-on: ubuntu-latest
    outputs:
      test_status: ${{ steps.result.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          echo "Running tests..."
          echo "All tests passed."

      - name: Save test status
        id: result
        run: echo "status=passed" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: [changes, test]
    if: needs.test.outputs.test_status == 'passed'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: app/backend/Dockerfile
            context: .
          - service: frontend
            dockerfile: app/frontend/Dockerfile
            context: .
          - service: integration
            dockerfile: app/integration/Dockerfile
            context: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # matrix isn't available in a job-level `if:`, so the per-service
      # build/push decision happens here instead (ref: 01 + 03 combined).
      - name: Determine whether to build/push this service
        id: check
        run: |
          service="${{ matrix.service }}"
          build="false"
          push="true"

          case "${{ github.event_name }}" in
            workflow_dispatch)
              if [ "${{ inputs.service }}" = "all" ] || [ "${{ inputs.service }}" = "$service" ]; then
                build="true"
              fi
              push="${{ inputs.push_image }}"
              ;;
            push)
              case "$service" in
                backend) changed="${{ needs.changes.outputs.backend }}" ;;
                frontend) changed="${{ needs.changes.outputs.frontend }}" ;;
                integration) changed="${{ needs.changes.outputs.integration }}" ;;
              esac
              if [[ "${{ github.ref }}" == refs/tags/* ]]; then
                # tag pushes (v*.*.*) always rebuild every service
                build="true"
              elif [ "$changed" = "true" ]; then
                build="true"
              fi
              ;;
            release|schedule)
              build="true"
              ;;
          esac

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"

      # surface ref/tag context on tag & release builds
      - name: Show release information
        if: steps.check.outputs.build == 'true' && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/'))
        run: |
          echo "Ref: $GITHUB_REF"
          echo "Ref Name: $GITHUB_REF_NAME"
          echo "Event Name: $GITHUB_EVENT_NAME"

      - name: Determine image tag
        id: tag
        if: steps.check.outputs.build == 'true'
        run: |
          if [ "${{ github.event_name }}" = "release" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Azure Container Registry
        if: steps.check.outputs.build == 'true' && steps.check.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      # type=gha cache, scoped per service
      - name: Build (& Push) Docker Image
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ steps.check.outputs.push == 'true' }}
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.APP_NAME }}-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/${{ env.APP_NAME }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=acr-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=acr-${{ matrix.service }}

      - name: Record build info artifact
        if: steps.check.outputs.build == 'true'
        run: |
          mkdir -p build-info
          {
            echo "service=${{ matrix.service }}"
            echo "registry=${{ env.ACR_REGISTRY }}"
            echo "image=${{ env.APP_NAME }}-${{ matrix.service }}"
            echo "tag=${{ steps.tag.outputs.tag }}"
            echo "pushed=${{ steps.check.outputs.push }}"
            echo "trigger=${{ github.event_name }}"
            echo "sha=${{ github.sha }}"
          } > build-info/${{ matrix.service }}.txt

      - name: Upload build info artifact
        if: steps.check.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: acr-build-info-${{ matrix.service }}
          path: build-info/${{ matrix.service }}.txt
          retention-days: 14